<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Price-O-Matic Overlay</title>
  <link rel="stylesheet" href="/overlay/static/overlay.css">
  <script type="module" src="/overlay/static/overlay.js"></script>
</head>
<body>
  <!--
    Viewer-facing OBS Browser Source: a slim copper-and-steel price band.
    Transparent everywhere except the band. Shows nothing until the backend sends a
    verified PriceCharting record. Contains no sample prices; demo/preview data is
    always watermarked.
  -->
  <div id="anchor" class="anchor" aria-live="polite">
    <div id="machine" class="machine layout-portrait" data-state="hidden" role="img" aria-label="Game price guide">
      <section class="body copper">
        <i class="screw" style="left:3px;top:3px"></i><i class="screw" style="right:3px;top:3px"></i>
        <i class="screw" style="left:3px;bottom:3px"></i><i class="screw" style="right:3px;bottom:3px"></i>
        <div class="hazard" aria-hidden="true"><i class="bolt"></i><i class="bolt"></i></div>

        <div class="inset">
          <!-- game identity: title + console on one slim row -->
          <div class="nameplate">
            <div class="nameplate-inner">
              <span class="lamp" aria-hidden="true"><span class="lamp-glass"></span><span class="lamp-glow"></span></span>
              <div class="swap title-swap" id="titleSwap">
                <h1 class="game-title" id="gameTitle"></h1>
              </div>
              <div class="swap meta-swap">
                <div class="console-tag"><span class="console-name stencil" id="consoleName"></span></div>
                <div class="meta-line"><span class="attribution" id="attribution" hidden></span><span class="asof" id="asOf"></span></div>
              </div>
            </div>
          </div>

          <!-- three CRT readouts; labels sit inside the screens to save height -->
          <div class="readouts">
            <div class="readout" data-kind="loose">
              <div class="crt"><div class="crt-glass"><span class="crt-label stencil">LOOSE</span><div class="swap"><span class="price" id="priceLoose"></span></div></div></div>
            </div>
            <div class="readout" data-kind="complete">
              <div class="crt"><div class="crt-glass"><span class="crt-label stencil">COMPLETE</span><div class="swap"><span class="price" id="priceComplete"></span></div></div></div>
            </div>
            <div class="readout" data-kind="new">
              <div class="crt"><div class="crt-glass"><span class="crt-label stencil">NEW</span><div class="swap"><span class="price" id="priceNew"></span></div></div></div>
            </div>
          </div>
        </div>
      </section>

      <div class="demo-watermark" id="demoMark" hidden>
        <span class="demo-big">DEMO DATA</span>
        <span class="demo-small">DEMO DATA · SAMPLE VALUES · NOT LIVE PRICES</span>
      </div>
    </div>
  </div>
</body>
</html>
