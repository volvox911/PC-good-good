<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="data:," />
  <title>Joe Dirt / Whatnot — Live Price Overlay</title>
  <!-- Exact families from FONTS_AND_LICENSES.md (Knewave, Barlow Condensed, Anton), bundled
       locally under the SIL Open Font License instead of the Google Fonts CDN. -->
  <link rel="preload" href="/overlay/static/knewave.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="/overlay/static/anton.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="/overlay/static/barlow-condensed-800.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="/overlay/static/barlow-condensed-900-italic.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="stylesheet" href="/overlay/static/style.css" />
  <script type="module" src="/overlay/static/overlay.js"></script>
</head>
<body data-overlay="hidden">
  <!--
    OBS: Browser Source 1080x1920; transparent background.
    Data arrives from this app's read-only local WebSocket (/ws/overlay): only verified
    PriceCharting records, as one atomic update. The page ships with no game or price.
    The ONLY baked visual element is the distressed metal frame / unlettered plates.
    All letters and prices below are live DOM text.
  -->
  <main class="broadcast" id="broadcast" aria-label="Game price reference overlay">
    <section class="header" id="header" aria-live="polite" aria-atomic="true" aria-label="Current game and reference prices">
      <img class="frame-skin" src="/overlay/static/header-skin.png" alt="" draggable="false" aria-hidden="true" />
      <!-- Same frame without the price plates, for the operator's "title only" mode. -->
      <img class="frame-skin frame-skin-title" src="/overlay/static/header-skin-title.png" alt="" draggable="false" aria-hidden="true" />

      <div class="title-area">
        <div class="title-frame"><span id="game-title" class="game-title"></span></div>
        <svg class="flourish" viewBox="0 0 300 14" preserveAspectRatio="none" aria-hidden="true"><path d="M2 9 C65 -1 180 0 293 8 C215 5 113 6 7 12 Z" fill="#ca1015" /><path d="M16 12 C65 7 176 5 276 8" stroke="#ef3630" stroke-width="1" fill="none" opacity=".5" /></svg>
        <div class="system-frame"><span id="game-system" class="game-system"></span></div>
      </div>

      <div class="value-plate loose-plate">
        <span class="plate-label">LOOSE</span>
        <div class="plate-price"><span id="price-loose" class="price-text"></span></div>
      </div>
      <div class="value-plate complete-plate">
        <span class="plate-label">COMPLETE</span>
        <div class="plate-price"><span id="price-complete" class="price-text"></span></div>
      </div>
      <div class="value-plate new-plate">
        <span class="plate-label">NEW</span>
        <div class="plate-price"><span id="price-new" class="price-text"></span></div>
      </div>

      <!-- Only in demo mode / dashboard design preview: sample values are never shown unmarked. -->
      <div class="demo-mark" id="demoMark" hidden>DEMO · SAMPLE VALUES · NOT LIVE PRICES</div>
    </section>

  </main>
</body>
</html>
